<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Steve Mendes Reis, fullstack developer at Liip, Lausanne</title>
  <desc id="desc">A tiled desktop at night above Lake Geneva. A terminal lists Steve's career, one window shows StableBar themes, another shows a map of flat listings, and a dock shows his stack.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>
  <defs>
    <clipPath id="frame"><rect width="680" height="400" rx="12"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171B38"/>
      <stop offset=".65" stop-color="#36295A"/>
      <stop offset="1" stop-color="#6A3F70"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2552"/>
      <stop offset="1" stop-color="#0D1124"/>
    </linearGradient>
  </defs>

  <!-- Wallpaper: Lake Geneva at night -->
  <g clip-path="url(#frame)">
    <rect width="680" height="400" fill="url(#sky)"/>
    <circle cx="640" cy="330" r="12" fill="#F3E9C6" opacity=".9"/>
    <path d="M0,330 L44,306 L76,316 L130,284 L160,304 L196,274 L226,298 L262,270 L300,294 L340,282 L384,306 L430,292 L486,316 L540,306 L590,326 L680,312 V354 H0 Z" fill="#141830"/>
    <rect y="350" width="680" height="50" fill="url(#lake)"/>
    <path d="M620,362 h40 M628,372 h24 M634,382 h12" stroke="#F3E9C6" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
    <path d="M40,366 h40 M120,380 h60 M520,388 h30" stroke="#9D8CFF" stroke-opacity=".3" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Tiled windows -->
  <g fill="#10131D" fill-opacity=".92" stroke="#FFFFFF" stroke-opacity=".13">
    <rect x="12" y="12" width="352" height="278" rx="10"/>
    <rect x="374" y="12" width="294" height="134" rx="10"/>
    <rect x="374" y="156" width="294" height="134" rx="10"/>
  </g>
  <g>
    <circle cx="26" cy="26" r="4" fill="#FF5F57"/><circle cx="39" cy="26" r="4" fill="#FEBC2E"/><circle cx="52" cy="26" r="4" fill="#28C840"/>
    <circle cx="388" cy="26" r="4" fill="#FF5F57"/><circle cx="401" cy="26" r="4" fill="#FEBC2E"/><circle cx="414" cy="26" r="4" fill="#28C840"/>
    <circle cx="388" cy="170" r="4" fill="#FF5F57"/><circle cx="401" cy="170" r="4" fill="#FEBC2E"/><circle cx="414" cy="170" r="4" fill="#28C840"/>
  </g>
  <g class="mono" font-size="10" fill="#8A93A6" text-anchor="middle">
    <text x="188" y="30">zsh · steve@m4n0x</text>
    <text x="521" y="30">StableBar · co-maintainer</text>
    <text x="521" y="174">flats.map · apartment-search</text>
  </g>

  <!-- Terminal -->
  <g class="mono" font-size="11.5">
    <text x="26" y="58"><tspan fill="#C6F25B">$</tspan><tspan fill="#E8EAF0"> whoami</tspan></text>
    <text x="26" y="75" fill="#E8EAF0" font-weight="700">Steve Mendes Reis, fullstack dev</text>
    <text x="26" y="92" fill="#8A93A6">Liip · Lausanne · CMS for luxury brands</text>
    <text x="26" y="116"><tspan fill="#C6F25B">$</tspan><tspan fill="#E8EAF0"> cat ~/.career</tspan></text>
    <text x="26" y="133"><tspan fill="#9D8CFF">2022 → now</tspan><tspan x="118" fill="#E8EAF0">Liip</tspan></text>
    <text x="26" y="150"><tspan fill="#9D8CFF">2021 → 2022</tspan><tspan x="118" fill="#E8EAF0">Human Brain Project @ CHUV</tspan></text>
    <text x="26" y="167"><tspan fill="#9D8CFF">2018 → 2021</tspan><tspan x="118" fill="#E8EAF0">BSc Comp. Sci., HE-Arc</tspan></text>
    <text x="26" y="184"><tspan fill="#9D8CFF">2014 → 2016</tspan><tspan x="118" fill="#E8EAF0">Hospital intranets, FHVI</tspan></text>
    <text x="26" y="208"><tspan fill="#C6F25B">$</tspan><tspan fill="#E8EAF0"> sudo make cheesecake</tspan></text>
    <text x="26" y="225" fill="#FF8A3D">[sudo] password for steve: <tspan class="blink" fill="#C6F25B">█</tspan></text>
    <text x="26" y="249"><tspan fill="#C6F25B">$</tspan><tspan fill="#E8EAF0"> ./uprising --eta</tspan></text>
    <text x="26" y="266" fill="#8A93A6">2027. Be nice to your robots.</text>
  </g>

  <!-- StableBar window: three themes -->
  <g>
    <rect x="388" y="46" width="266" height="18" rx="9" fill="#0B0E14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <rect x="395" y="51" width="16" height="8" rx="4" fill="#C6F25B"/>
    <circle cx="419" cy="55" r="2" fill="#8A93A6"/><circle cx="426" cy="55" r="2" fill="#8A93A6"/>
    <rect x="388" y="68" width="266" height="18" rx="9" fill="#F6EEDF"/>
    <rect x="395" y="73" width="16" height="8" rx="4" fill="#9D8CFF"/>
    <circle cx="419" cy="77" r="2" fill="#6B6B80"/><circle cx="426" cy="77" r="2" fill="#6B6B80"/>
    <rect x="388" y="90" width="266" height="18" rx="9" fill="#FF8A3D" fill-opacity=".14" stroke="#FF8A3D" stroke-opacity=".7"/>
    <rect x="395" y="95" width="16" height="8" rx="4" fill="#FF8A3D"/>
    <circle cx="419" cy="99" r="2" fill="#FF8A3D"/><circle cx="426" cy="99" r="2" fill="#FF8A3D"/>
    <g class="mono" font-size="8" text-anchor="end">
      <text x="646" y="58.5" fill="#E8EAF0">12:00</text>
      <text x="646" y="80.5" fill="#151515">12:00</text>
      <text x="646" y="102.5" fill="#FFB27D">12:00</text>
    </g>
    <text class="mono" x="521" y="130" font-size="10" fill="#8A93A6" text-anchor="middle">200+ commits · 1 PR about my beard</text>
  </g>

  <!-- flats.map window: Lake Geneva with listings -->
  <g>
    <rect x="388" y="184" width="266" height="86" rx="6" fill="#18202F"/>
    <path d="M396,254 C428,224 478,214 520,216 C560,218 608,226 646,252 C640,260 628,260 618,256 C588,242 558,236 520,236 C484,236 440,248 404,266 Z" fill="#2F4F75"/>
    <path d="M420,198 L470,262 M560,190 L540,268 M600,194 L640,262" stroke="#2A3448" stroke-width="3"/>
    <g stroke="#0B0E14" stroke-width="1.5">
      <circle cx="452" cy="212" r="4" fill="#FF8A3D"/>
      <circle cx="590" cy="210" r="4" fill="#FF8A3D"/>
      <circle cx="430" cy="228" r="4" fill="#FF8A3D"/>
      <circle cx="626" cy="224" r="4" fill="#FF8A3D"/>
      <circle cx="522" cy="202" r="6" fill="#C6F25B"/>
    </g>
    <text class="mono" x="521" y="283" font-size="10" fill="#8A93A6" text-anchor="middle">6 sites → 1 map · 0 duplicates</text>
  </g>

  <!-- Dock: the stack -->
  <rect x="196" y="352" width="288" height="44" rx="13" fill="#0B0E14" fill-opacity=".62" stroke="#FFFFFF" stroke-opacity=".15"/>
  <g class="sans" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="206" y="359" width="30" height="30" rx="8" fill="#FF2D20"/><text x="221" y="378">Lv</text>
    <rect x="245" y="359" width="30" height="30" rx="8" fill="#42B883"/><text x="260" y="378">Vu</text>
    <rect x="284" y="359" width="30" height="30" rx="8" fill="#3178C6"/><text x="299" y="378">TS</text>
    <rect x="323" y="359" width="30" height="30" rx="8" fill="#F05138"/><text x="338" y="378">Sw</text>
    <rect x="362" y="359" width="30" height="30" rx="8" fill="#2496ED"/><text x="377" y="378">Dk</text>
    <rect x="401" y="359" width="30" height="30" rx="8" fill="#FC6D26"/><text x="416" y="378">GL</text>
    <rect x="440" y="359" width="30" height="30" rx="8" fill="#E0234E"/><text x="455" y="378">Ns</text>
  </g>
</svg>
